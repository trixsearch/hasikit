# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Gradle daemon heap — increased from 2048m.
# With 2048m, the Kotlin compile daemon gets starved when Gradle daemon + Kotlin daemon
# + KAPT worker all compete for memory. The Kotlin daemon crashes mid-compile, leaves
# R.jar and shrunk-classpath-snapshot.bin with open handles, and the next build fails
# with "process cannot access the file". 4096m gives each process enough headroom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Kotlin compile daemon heap — set explicitly so it doesn't inherit Gradle's heap.
# Default is 700m which is too small for this project (Compose compiler + KAPT stubs).
# Daemon crash = open file handles on Windows = R.jar lock on next build.
kotlin.daemon.jvm.options=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Parallel builds disabled — single-module project gains nothing, and parallel
# resource processing creates competing file locks on R.jar on Windows.
# org.gradle.parallel=true

# Configuration cache DISABLED — this is the primary cause of the R.jar lock.
# Configuration cache serializes task graphs and holds file handles on intermediates
# (including R.jar) between builds. On Windows, these handles are exclusive and
# are not released when the Gradle daemon idles, causing the next build to fail
# with "process cannot access the file because it is being used by another process".
# Re-enable only after upgrading to AGP 9+ which has a fixed CC implementation.
org.gradle.configuration-cache=false

# Kill idle daemons after 15 minutes — prevents stale daemons from holding
# file locks on R.jar and other intermediates across build sessions.
org.gradle.daemon.idletimeout=900000

# Run KAPT annotation processors in a separate worker process (not in-process).
# This isolates KAPT's classloader from the Gradle daemon, preventing KAPT from
# holding a read lock on R.jar while AGP's processResources task writes it.
kapt.use.worker.api=true

# Disable KAPT incremental processing — incremental KAPT reads stale R.jar
# snapshots from the build cache and can conflict with the live R.jar on Windows.
kapt.incremental.apt=false

# for configuring jdk21 from the system
org.gradle.java.home=C:/Program Files/Java/jdk-21
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.useAndroidX=true
android.enableJetifier=true
